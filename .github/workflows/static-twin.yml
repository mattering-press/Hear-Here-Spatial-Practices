# Builds the static twin of the book (everytrick/), checks every internal link and local file in it, and tests the house
# citation style.
# On main it also publishes the result on GitHub Pages, but only once Pages is enabled for the repository
# with "GitHub Actions" as its source; until then the deploy job is skipped.
# On every push to any branch it also uploads the build as a preview to Cloudflare Pages, when the
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets are set (see "Previews" in DEVELOPMENT.md): an open preview,
# or, for a branch whose name starts with "private-", a preview behind Cloudflare Access.
name: Static twin

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read   # only to ask whether Pages is enabled
    outputs:
      deploy: ${{ steps.pages.outputs.deploy }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the whole history with its tags: frozen versions are built from their tags (versions.json)

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: everytrick/package-lock.json

      - name: Install Pandoc 3.8.3
        run: |
          curl -fsSL -o "$RUNNER_TEMP/pandoc.deb" https://github.com/jgm/pandoc/releases/download/3.8.3/pandoc-3.8.3-1-amd64.deb
          echo "d7fac78b58b8c8da39254955eff321233ab97d74e8b2d461c0f0719a1fb5f357  $RUNNER_TEMP/pandoc.deb" | sha256sum --check
          sudo dpkg -i "$RUNNER_TEMP/pandoc.deb"
          pandoc --version | head -n 1

      # The build renders the book's PDF documents, page by page, and reads their text with poppler (pdftoppm and
      # pdftotext): "Plan: documents and zines" in DEVELOPMENT.md.
      - name: Install poppler
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q poppler-utils
          pdftoppm -v 2>&1 | head -n 1

      # Every branch but main is a preview build: EVERYTRICK_PREVIEW adds the Media Index's editing view,
      # /media-index/edit/, which the public site, built from main, never has ("The media register" in DEVELOPMENT.md).
      - name: Build
        working-directory: everytrick
        env:
          EVERYTRICK_PREVIEW: ${{ github.ref != 'refs/heads/main' && 'true' || '' }}
        run: |
          npm ci
          npm run build

      - name: Check links and files
        working-directory: everytrick
        run: npm run check

      - name: Test the house citation style
        working-directory: everytrick
        run: npm run test:csl

      - name: Preview on Cloudflare Pages
        if: github.event_name == 'push'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::No Cloudflare secrets, so no preview."
            exit 0
          fi
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects"
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json")
          exists() { [ "$(curl -sS "${auth[@]}" "$api/$1" -o /dev/null -w '%{http_code}' || true)" = 200 ]; }
          case "$BRANCH" in
            private-*)
              # A private branch goes only to the project behind Access, which is never created here: until someone
              # has made it and switched its Access policy on (DEVELOPMENT.md, "Previews"), nothing is uploaded.
              PROJECT=hearhere-private; KIND="Private preview (Cloudflare Access)"
              if ! exists "$PROJECT"; then
                echo "::error::The Cloudflare Pages project $PROJECT does not exist, so this private branch was not previewed. See \"Previews\" in DEVELOPMENT.md."
                exit 1
              fi ;;
            *)
              PROJECT=hearhere-preview; KIND="Preview"
              # Create the open project once. Its production branch is one that never deploys, so every deployment,
              # main included, is a preview.
              if ! exists "$PROJECT"; then
                curl -fsS "${auth[@]}" -X POST "$api" \
                  -d "{\"name\": \"$PROJECT\", \"production_branch\": \"cloudflare-production-unused\"}" > /dev/null
                echo "Created the Cloudflare Pages project $PROJECT."
              fi ;;
          esac
          subdomain=$(curl -fsS "${auth[@]}" "$api/$PROJECT" | jq -r .result.subdomain)
          # Previews are kept out of search engines whatever the project's settings: a header for every file, in a
          # _headers file that is uploaded with the preview and removed again, so it never reaches GitHub Pages.
          printf '/*\n  X-Robots-Tag: noindex, nofollow\n' > ../_site/_headers
          trap 'rm -f ../_site/_headers' EXIT
          npx --yes wrangler@4.158.0 pages deploy ../_site --project-name="$PROJECT" --branch="$BRANCH" \
            --commit-hash="$GITHUB_SHA" --commit-dirty=true | tee "$RUNNER_TEMP/wrangler.log"
          deployment=$(grep -o 'https://[a-z0-9-]*\.'"$subdomain" "$RUNNER_TEMP/wrangler.log" | head -n 1)
          alias="https://$(echo "$BRANCH" | tr 'A-Z' 'a-z' | sed 's/[^a-z0-9-]/-/g' | cut -c1-28 | sed 's/-*$//').$subdomain"
          if [ "$PROJECT" = hearhere-private ]; then
            # A private preview that opens without signing in is taken down again at once.
            sleep 10
            code=$(curl -sS -o /dev/null -w '%{http_code}' "$deployment/" || true)
            if [ "$code" = 200 ]; then
              id=$(curl -fsS "${auth[@]}" "$api/$PROJECT/deployments?env=preview&per_page=25" | jq -r --arg u "$deployment" '.result[] | select(.url == $u) | .id')
              [ -n "$id" ] && curl -fsS "${auth[@]}" -X DELETE "$api/$PROJECT/deployments/$id?force=true" > /dev/null
              echo "::error::$deployment opened without Cloudflare Access, so it was deleted. Switch on the Access policy of $PROJECT (DEVELOPMENT.md, \"Previews\")."
              exit 1
            fi
          fi
          {
            echo "### $KIND"
            echo "- Latest on this branch: $alias"
            echo "- This push, kept until deleted: $deployment"
          } >> "$GITHUB_STEP_SUMMARY"
        working-directory: everytrick

      - name: Is GitHub Pages enabled?
        id: pages
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type 2>/dev/null)" = workflow ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::GitHub Pages is not enabled with GitHub Actions as its source, so the site is not deployed."
          fi

      - name: Upload the site for GitHub Pages
        if: steps.pages.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
