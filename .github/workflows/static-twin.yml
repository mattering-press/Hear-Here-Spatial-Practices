# Builds the static twin of the book (kit/) and checks every internal link and local file in it.
# On main it also publishes the result on GitHub Pages, but only once Pages is enabled for the repository
# with "GitHub Actions" as its source; until then the deploy job is skipped.
name: Static twin

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read   # only to ask whether Pages is enabled
    outputs:
      deploy: ${{ steps.pages.outputs.deploy }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: kit/package-lock.json

      - name: Install Pandoc 3.8.3
        run: |
          curl -fsSL -o "$RUNNER_TEMP/pandoc.deb" https://github.com/jgm/pandoc/releases/download/3.8.3/pandoc-3.8.3-1-amd64.deb
          echo "d7fac78b58b8c8da39254955eff321233ab97d74e8b2d461c0f0719a1fb5f357  $RUNNER_TEMP/pandoc.deb" | sha256sum --check
          sudo dpkg -i "$RUNNER_TEMP/pandoc.deb"
          pandoc --version | head -n 1

      - name: Build
        working-directory: kit
        run: |
          npm ci
          npm run build

      - name: Check links and files
        working-directory: kit
        run: npm run check

      - name: Is GitHub Pages enabled?
        id: pages
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type 2>/dev/null)" = workflow ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::GitHub Pages is not enabled with GitHub Actions as its source, so the site is not deployed."
          fi

      - name: Upload the site for GitHub Pages
        if: steps.pages.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
