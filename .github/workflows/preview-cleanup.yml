# Deletes a branch's private previews on Cloudflare Pages when the branch is deleted on GitHub, and can be run by
# hand for any branch name (Actions -> "Delete private previews" -> Run workflow).
name: Delete private previews

on:
  delete:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch whose previews to delete
        required: true

permissions:
  contents: read

jobs:
  cleanup:
    if: github.event_name == 'workflow_dispatch' || github.event.ref_type == 'branch'
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: hearhere-preview
      BRANCH: ${{ github.event.inputs.branch || github.event.ref }}
    steps:
      - name: Delete the branch's deployments
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::No Cloudflare secrets, nothing to delete."
            exit 0
          fi
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT/deployments"
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          page=1; deleted=0
          while :; do
            ids=$(curl -fsS "${auth[@]}" "$api?env=preview&page=$page&per_page=25" \
              | jq -r --arg b "$BRANCH" '.result[] | select(.deployment_trigger.metadata.branch == $b) | .id')
            count=$(curl -fsS "${auth[@]}" "$api?env=preview&page=$page&per_page=25" | jq '.result | length')
            for id in $ids; do
              curl -fsS "${auth[@]}" -X DELETE "$api/$id?force=true" > /dev/null && deleted=$((deleted + 1))
            done
            [ "$count" -lt 25 ] && break
            # deleting shifts later deployments onto earlier pages, so only advance when nothing was deleted here
            [ -z "$ids" ] && page=$((page + 1))
          done
          echo "Deleted $deleted preview deployment(s) of $BRANCH." | tee -a "$GITHUB_STEP_SUMMARY"
